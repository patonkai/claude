<!doctype html>
<html lang="{{ user.language if user else 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Purgo{% endblock %} · Purgo</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/">Purgo</a>
  <nav>
    {% if user %}
      <a href="/dashboard">Dashboard</a>
      <a href="/profile">Profile</a>
      {% if user.is_admin %}<a href="/admin">Operator queue</a><a href="/admin/brokers">Brokers</a>{% endif %}
      <form class="inline" method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link">Log out</button></form>
    {% else %}
      <a href="/login">Log in</a><a class="btn" href="/register">Get started</a>
    {% endif %}
  </nav>
</div></header>
<main class="wrap">
  {% for f in flashes %}<div class="flash {{ f.kind }}">{{ f.message }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
